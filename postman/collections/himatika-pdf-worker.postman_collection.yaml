              {
                "fileKey": "videos/raw/postman.mp4",
                "videoId": "postman-video-id",
                "callbackUrl": "https://postman-echo.com/post"
              }
        event:
          - listen: prerequest
            script: |
              if (!pm.collectionVariables.get("jwtToken") && pm.variables.get("jwtSecret")) {
                const header = { alg: "HS256", typ: "JWT" };
