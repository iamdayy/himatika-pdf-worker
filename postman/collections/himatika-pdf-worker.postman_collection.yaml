info:
  name: HIMATIKA PDF Worker
  description: |
    Kontrak semua endpoint HIMATIKA PDF Worker (Vercel serverless).

    Semua endpoint memerlukan header `Authorization: Bearer <jwt_token>` kecuali
    `GET /` dan `GET /healthz`. Token harus diklaim `{"service": "himatika-backend"`
    dan ditandatangani dengan `HIMATIKA_JWT_SECRET` yang sama dengan backend.

    Sebelum menjalankan: isi variabel environment `baseUrl` dan `jwtSecret`.
    Variabel `jwtToken` di-generate otomatis oleh pre-request script koleksi.
  version: "1.0.0"
variable:
  - id: baseUrl
    type: string
    value: http://localhost:5000
    description: Base URL worker (localhost atau Vercel deployment)
  - id: jwtSecret
    type: any
    value: ""
    description: HIMATIKA_JWT_SECRET — sama persis dengan jwtSecret backend
  - id: jwtToken
    type: any
    value: ""
    description: Di-generate otomatis pre-request; jangan diisi manual
  - id: docNumber
    type: string
    value: "001/HMTK/2026"
  - id: nim
    type: string
    value: "12345678"
  - id: pdfUrl
    type: string
    value: "https://pdfobject.com/pdf/sample.pdf"
item:
  - name: Health
    item:
      - name: GET / health
        request:
          method: GET
          url: "{{baseUrl}}/"
        event:
          - listen: test
            script: |
              pm.test("Status is 200", function () {
                pm.response.to.have.status(200);
              });
              pm.test("Body has status success", function () {
                const json = pm.response.json();
                pm.expect(json.status).to.eql("success");
              });
      - name: GET /healthz deep check
        request:
          method: GET
          url: "{{baseUrl}}/healthz"
        event:
          - listen: test
            script: |
              pm.test("Status is 200 or 503", function () {
                pm.expect(pm.response.code).to.be.oneOf([200, 503]);
              });
              const json = pm.response.json();
              pm.test("Body has status field", function () {
                pm.expect(json).to.have.property("status");
              });
              if (json.status === "unhealthy") {
                console.log("Unhealthy problems:", JSON.stringify(json.problems));
              });
  - name: Auth (no token -> 401)
    item:
      - name: POST /api/sign/process without JWT -> 401
        request:
          method: POST
          url: "{{baseUrl}}/api/sign/process"
          header:
            - { key: Content-Type, value: application/json }
          body:
            mode: raw
            raw: |-
              {
                "pdf": "{{pdfUrl}}",
                "outputBlobPath": "testing/no-auth.pdf",
                "qrValue": "NOAUTH-TEST"
              }
        event:
          - listen: test
            script: |
              pm.test("Status is 401", function () {
                pm.response.to.have.status(401);
              });
              pm.test("Body says Unauthorized", function () {
                const json = pm.response.json();
                pm.expect(json.error).to.include("Unauthorized");
              });
  - name: PDF
    item:
      - name: POST /api/pdf/scan-qr (URL)
        request:
          method: POST
          url: "{{baseUrl}}/api/pdf/scan-qr"
          header:
            - { key: Authorization, value: "Bearer {{jwtToken}}" }
            - { key: Content-Type, value: application/json }
          body:
            mode: raw
            raw: |-
              {
                "pdf": "{{pdfUrl}}"
              }
        event:
          - listen: prerequest
            script: |
              if (!pm.collectionVariables.get("jwtToken") && pm.variables.get("jwtSecret")) {
                const header = { alg: "HS256", typ: "JWT" };
                const payload = { service: "himatika-backend" };
                const secret = pm.variables.get("jwtSecret");
                const b64u = (o) => btoa(JSON.stringify(o)).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
                const si = b64u(header) + "." + b64u(payload);
                const sig = CryptoJS.HmacSHA256(si, secret).toString(CryptoJS.enc.Base64).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
                pm.collectionVariables.set("jwtToken", si + "." + sig);
              }
          - listen: test
            script: |
              pm.test("Status is 200", function () {
                pm.response.to.have.status(200);
              });
              const json = pm.response.json();
              pm.test("Body has status field", function () {
                pm.expect(json).to.have.property("status");
              });
              pm.test("Status found or not_found", function () {
                pm.expect(json.status).to.be.oneOf(["found", "not_found"]);
              });
      - name: POST /api/pdf/search-text
        request:
          method: POST
          url: "{{baseUrl}}/api/pdf/search-text"
          header:
            - { key: Authorization, value: "Bearer {{jwtToken}}" }
            - { key: Content-Type, value: application/json }
          body:
            mode: raw
            raw: |-
              {
                "pdf": "{{pdfUrl}}",
                "text": "Signature"
              }
        event:
          - listen: prerequest
            script: |
              if (!pm.collectionVariables.get("jwtToken") && pm.variables.get("jwtSecret")) {
                const header = { alg: "HS256", typ: "JWT" };
                const payload = { service: "himatika-backend" };
                const secret = pm.variables.get("jwtSecret");
                const b64u = (o) => btoa(JSON.stringify(o)).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
                const si = b64u(header) + "." + b64u(payload);
                const sig = CryptoJS.HmacSHA256(si, secret).toString(CryptoJS.enc.Base64).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
                pm.collectionVariables.set("jwtToken", si + "." + sig);
              }
          - listen: test
            script: |
              pm.test("Status is 200", function () {
                pm.response.to.have.status(200);
              });
              pm.test("Body is array", function () {
                pm.expect(pm.response.json()).to.be.an("array");
              });
