                pm.collectionVariables.set("jwtToken", si + "." + sig);
              }
          - listen: test
            script: |
              pm.test("Status is 503 (ffmpeg unavailable on Vercel)", function () {
                pm.response.to.have.status(503);
              });
              const json = pm.response.json();
              pm.test("Body explains unavailability", function () {
                pm.expect(json.error).to.include("ffmpeg");
              });
